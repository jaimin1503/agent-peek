[package]
name = "agentpeek"
version = "0.1.0"
description = "Always-on-top overlay showing what your AI coding agents are doing"
authors = ["you"]
edition = "2021"

[lib]
name = "agentpeek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Needed only to raise the overlay above native-fullscreen apps; see lib.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSResponder",
  "NSPanel",
  "NSEvent",
  "block2",
] }
# Only for the global mouse monitor's handler block; already in the tree via wry.
block2 = "0.6"
